<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Flash Sale Scheduler</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.93), rgba(15, 23, 42, 0.97)), 
                        url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.6rem; color: #f43f5e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        header p { color: #94a3b8; font-size: 1.15rem; }

        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .deal-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .deal-card:hover { transform: translateY(-5px); border-color: #f43f5e; }
        
        /* Fades expired sales out gracefully */
        .deal-card.expired-card { opacity: 0.4; filter: grayscale(60%); }
        .deal-card.expired-card:hover { transform: none; border-color: rgba(255, 255, 255, 0.1); }

        .image-container { width: 100%; height: 200px; position: relative; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        .status-badge {
            position: absolute; top: 15px; right: 15px;
            padding: 6px 14px; border-radius: 50px;
            font-size: 0.85rem; font-weight: bold; text-transform: uppercase;
        }
        .status-badge.active { background: #10b981; color: white; }
        .status-badge.upcoming { background: #3b82f6; color: white; }
        .status-badge.expired { background: #64748b; color: white; }

        .card-body { padding: 22px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 12px; color: #f1f5f9; }

        .price-box { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .current-price { font-size: 1.7rem; font-weight: 700; color: #f43f5e; }
        .original-price { font-size: 1.15rem; color: #64748b; text-decoration: line-through; }
        .discount-tag { background: rgba(244, 63, 94, 0.15); color: #f43f5e; padding: 2px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }

        .countdown-container { background: rgba(15, 23, 42, 0.6); border-radius: 10px; padding: 12px; text-align: center; }
        .countdown-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .countdown-timer { font-family: monospace; font-size: 1.3rem; font-weight: bold; color: #e2e8f0; }
        
        .error-message { grid-column: 1/-1; text-align: center; padding: 40px; background: rgba(244, 63, 94, 0.1); border: 1px dashed #f43f5e; border-radius: 12px; color: #fda4af; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Live Flash Sale Scheduler ⚡</h1>
            <p>Accessing API records to display 15 live synchronized products</p>
        </header>

        <div class="deals-grid" id="dealsGrid">
            <p style="text-align: center; grid-column: 1/-1;">Connecting to live database stream...</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/deals';
        let countdownInterval;

        async function loadDeals() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderCards(data.deals);
            } catch (error) {
                document.getElementById('dealsGrid').innerHTML = `
                    <div class="error-message">
                        <h3>Failed to connect to Backend Server</h3>
                        <p style="margin-top: 8px;">Make sure you ran <b>node server.js</b> in your terminal and that port 5000 is open.</p>
                    </div>
                `;
            }
        }

        function renderCards(deals) {
            const grid = document.getElementById('dealsGrid');
            grid.innerHTML = ''; 

            clearInterval(countdownInterval); 
            const activeTimers = [];

            deals.forEach((deal, index) => {
                let timeLabel = "Sale Ends In:";
                if (deal.status === 'upcoming') timeLabel = "Sale Starts In:";
                if (deal.status === 'expired') timeLabel = "Offer Ended";

                if (deal.status !== 'expired') {
                    activeTimers.push({
                        id: `timer_${index}`,
                        msLeft: deal.timeRemainingMs
                    });
                }

                grid.innerHTML += `
                    <div class="deal-card ${deal.status === 'expired' ? 'expired-card' : ''}">
                        <div class="image-container">
                            <img src="${deal.image}" alt="${deal.name}">
                            <div class="status-badge ${deal.status}">${deal.status}</div>
                        </div>
                        <div class="card-body">
                            <div class="product-name">${deal.name}</div>
                            <div class="price-box">
                                <span class="current-price">$${deal.currentPrice}</span>
                                ${deal.status === 'active' ? `<span class="original-price">$${deal.originalPrice}</span>` : ''}
                                <span class="discount-tag">${deal.discountPercent}% OFF</span>
                            </div>
                            <div class="countdown-container">
                                <div class="countdown-label">${timeLabel}</div>
                                <div class="countdown-timer" id="timer_${index}">
                                    ${deal.status === 'expired' ? '--h --m --s' : '00h 00m 00s'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            runClockEngine(activeTimers);
        }

        function runClockEngine(timers) {
            function tick() {
                timers.forEach(timer => {
                    if (timer.msLeft <= 0) {
                        const el = document.getElementById(timer.id);
                        if (el) el.innerText = "00h 00m 00s";
                        return;
                    }

                    let seconds = Math.floor(timer.msLeft / 1000);
                    let hours = Math.floor(seconds / 3600).toString().padStart(2, '0');
                    let minutes = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                    let remainingSecs = (seconds % 60).toString().padStart(2, '0');

                    const element = document.getElementById(timer.id);
                    if (element) {
                        element.innerText = `${hours}h ${minutes}m ${remainingSecs}s`;
                    }
                    
                    timer.msLeft -= 1000;
                });
            }
            tick();
            countdownInterval = setInterval(tick, 1000);
        }

        // Run application script
        loadDeals();
        // Polling loop to fetch fresh dates from node server every 30 seconds
        setInterval(loadDeals, 30000);
    </script>
</body>
</html>
